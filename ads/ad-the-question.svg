<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#1a2744"/>

  <!-- Logo -->
  <g transform="translate(60, 50)">
    <circle cx="45" cy="45" r="45" fill="#0f1b30"/>
    <polygon points="30,32 35,18 40,32" fill="#c9a962"/>
    <polygon points="40,32 45,18 50,32" fill="#c9a962"/>
    <polygon points="50,32 55,18 60,32" fill="#c9a962"/>
    <rect x="27" y="32" width="36" height="3" fill="#c9a962"/>
    <text x="45" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">CMF</text>
  </g>

  <!-- Main question -->
  <text x="540" y="280" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">Do you have</text>
  <text x="540" y="400" font-family="Georgia, serif" font-size="120" font-weight="900" fill="#c9a962" text-anchor="middle">$8,000</text>
  <text x="540" y="500" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">set aside for</text>
  <text x="540" y="600" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">your funeral?</text>

  <!-- If not line -->
  <line x1="300" y1="660" x2="780" y2="660" stroke="#c9a962" stroke-width="2"/>
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.7)" text-anchor="middle">If not, your family will have to.</text>

  <!-- Solution -->
  <rect x="180" y="790" width="720" height="160" rx="12" fill="rgba(201,169,98,0.15)" stroke="#c9a962" stroke-width="2"/>
  <text x="540" y="850" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle">Final Expense Insurance</text>
  <text x="540" y="910" font-family="Arial, sans-serif" font-size="34" fill="#c9a962" text-anchor="middle">Starting at just $1/day. No medical exam.</text>

  <!-- Bottom -->
  <text x="540" y="1030" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.5)" text-anchor="middle">Ages 50-85 | Rates locked in for life | Free quote in 30 seconds</text>
</svg>

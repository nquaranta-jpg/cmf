<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1080" fill="#0a0a0a"/>

  <!-- Logo -->
  <g transform="translate(60, 30)">
    <circle cx="45" cy="45" r="45" fill="#0f1b30"/>
    <polygon points="30,32 35,18 40,32" fill="#c9a962"/>
    <polygon points="40,32 45,18 50,32" fill="#c9a962"/>
    <polygon points="50,32 55,18 60,32" fill="#c9a962"/>
    <rect x="27" y="32" width="36" height="3" fill="#c9a962"/>
    <text x="45" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">CMF</text>
  </g>

  <!-- Age price ladder -->
  <text x="540" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#888888" text-anchor="middle">YOUR MONTHLY RATE BY AGE</text>

  <!-- Age bars - getting more red/expensive -->
  <rect x="140" y="190" width="200" height="65" rx="6" fill="#1a3a2a"/>
  <text x="160" y="232" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#4ade80">Age 50</text>
  <text x="800" y="232" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#4ade80" text-anchor="end">$18/mo</text>

  <rect x="140" y="280" width="300" height="65" rx="6" fill="#2a3a1a"/>
  <text x="160" y="322" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a3e635">Age 55</text>
  <text x="800" y="322" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#a3e635" text-anchor="end">$24/mo</text>

  <rect x="140" y="370" width="420" height="65" rx="6" fill="#3a3a1a"/>
  <text x="160" y="412" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#facc15">Age 60</text>
  <text x="800" y="412" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#facc15" text-anchor="end">$35/mo</text>

  <rect x="140" y="460" width="540" height="65" rx="6" fill="#3a2a1a"/>
  <text x="160" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fb923c">Age 65</text>
  <text x="800" y="502" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fb923c" text-anchor="end">$48/mo</text>

  <rect x="140" y="550" width="660" height="65" rx="6" fill="#3a1a1a"/>
  <text x="160" y="592" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f87171">Age 70</text>
  <text x="800" y="592" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#f87171" text-anchor="end">$67/mo</text>

  <rect x="140" y="640" width="800" height="65" rx="6" fill="#4a1a1a"/>
  <text x="160" y="682" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ef4444">Age 75+</text>
  <text x="800" y="682" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ef4444" text-anchor="end">$89+/mo</text>

  <!-- Arrow pointing up -->
  <text x="880" y="450" font-family="Arial, sans-serif" font-size="60" fill="#ef4444">^</text>
  <text x="920" y="450" font-family="Arial, sans-serif" font-size="22" fill="#ef4444" writing-mode="tb">COST GOES UP</text>

  <!-- Urgency message -->
  <line x1="140" y1="750" x2="940" y2="750" stroke="#c9a962" stroke-width="2"/>
  <text x="540" y="820" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#ffffff" text-anchor="middle">Today is the cheapest</text>
  <text x="540" y="885" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#c9a962" text-anchor="middle">your rate will ever be.</text>

  <!-- CTA -->
  <rect x="250" y="930" width="580" height="75" rx="8" fill="#c9a962"/>
  <text x="540" y="978" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0a0a0a" text-anchor="middle">LOCK IN YOUR RATE NOW</text>

  <text x="540" y="1050" font-family="Arial, sans-serif" font-size="22" fill="#555555" text-anchor="middle">No Medical Exam | Ages 50-85 | Free Quote in 30 Seconds</text>
</svg>

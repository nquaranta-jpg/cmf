[build]
  publish = "."
  command = "echo 'no build needed'"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# publish = "." serves the whole repo as static files, which would expose
# backend source (and anything else) unless blocked. Keep these first —
# Netlify applies the first matching redirect.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/products/final-expense"
  to = "/products/final-expense.html"
  status = 200

[[redirects]]
  from = "/products/term-life"
  to = "/products/term-life.html"
  status = 200

[[redirects]]
  from = "/products/annuity"
  to = "/products/annuity.html"
  status = 200

[[redirects]]
  from = "/products/iul"
  to = "/products/iul.html"
  status = 200

[[redirects]]
  from = "/community"
  to = "/community.html"
  status = 200

[[redirects]]
  from = "/vgli-calculator"
  to = "/vgli-calculator.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

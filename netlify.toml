[build]
  publish = "."
  # Static site, no bundling. check-rates fails the deploy only if
  # RATES_VERIFIED=true while src/mcp/config/rates.json is incomplete.
  command = "node scripts/check-rates.mjs"

# MCP connector function (netlify/functions/mcp.ts) is TypeScript + ESM and
# imports the MCP SDK, so it needs esbuild. Scoped to this one function so the
# existing .mjs functions keep their current bundler.
[functions."mcp"]
  node_bundler = "esbuild"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# publish = "." serves the whole repo as static files, which would expose
# backend source (and anything else) unless blocked. Keep these first —
# Netlify applies the first matching redirect.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

# SQL migrations for CMF Launch live in /supabase — never serve them
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true


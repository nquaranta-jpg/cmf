[build]
  publish = "."
  command = "echo 'no build needed'"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# publish = "." serves the whole repo as static files, which would expose
# backend source (and anything else) unless blocked. Keep these first —
# Netlify applies the first matching redirect.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

# SQL migrations for CMF Launch live in /supabase — never serve them
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# Email tooling source — never serve
[[redirects]]
  from = "/cold-outreach/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/email-campaigns/*"
  to = "/index.html"
  status = 404
  force = true


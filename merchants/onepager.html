<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statement Analysis | Crown Merchant Financial</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/variables.css" />
    <style>
      body { background: #eef1f5; font-family: "Nunito Sans", sans-serif; color: var(--text); padding: 2rem 1rem; }
      .toolbar { max-width: 760px; margin: 0 auto 1rem; display: flex; gap: 0.75rem; justify-content: flex-end; }
      .toolbar button { background: var(--navy); color: #fff; border: none; padding: 0.6rem 1.2rem; font-weight: 700; cursor: pointer; border-radius: 4px; }
      .page { max-width: 760px; margin: 0 auto; background: #fff; padding: 3rem; box-shadow: 0 10px 40px rgba(10,22,40,0.12); }
      .op-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); padding-bottom: 1.25rem; margin-bottom: 1.75rem; }
      .op-brand { display: flex; align-items: center; gap: 0.6rem; }
      .op-brand .mark { width: 34px; height: 34px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); border-radius: 4px; display: flex; align-items: center; justify-content: center; color: var(--navy); }
      .op-brand strong { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.15rem; color: var(--navy); }
      .op-head .meta { text-align: right; font-size: 0.8rem; color: var(--slate); }
      h1 { font-family: "Cormorant Garamond", Georgia, serif; color: var(--navy); font-size: 1.9rem; font-weight: 600; margin-bottom: 0.25rem; }
      .subtitle { color: var(--slate); font-size: 0.95rem; margin-bottom: 1.75rem; }
      .op-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.75rem; }
      .op-stat { border: 1px solid #e2e8f0; padding: 1.1rem; text-align: center; }
      .op-stat .label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--slate); margin-bottom: 0.3rem; }
      .op-stat .value { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1.7rem; font-weight: 700; color: var(--navy); }
      .op-stat.gold { background: rgba(201,169,98,0.09); border-color: var(--gold); }
      .op-stat.gold .value { color: var(--gold-dark); }
      h2 { font-family: "Cormorant Garamond", Georgia, serif; color: var(--navy); font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.6rem; }
      p { line-height: 1.7; font-size: 0.95rem; margin-bottom: 0.75rem; }
      ul.flags { list-style: none; margin: 0 0 0.75rem; }
      ul.flags li { padding: 0.35rem 0 0.35rem 1.5rem; position: relative; font-size: 0.92rem; }
      ul.flags li::before { content: "⚑"; position: absolute; left: 0; color: var(--gold-dark); }
      table.fees { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-bottom: 0.75rem; }
      table.fees td { padding: 0.35rem 0.25rem; border-bottom: 1px solid #f1f5f9; }
      table.fees td:last-child { text-align: right; white-space: nowrap; }
      .op-close { margin-top: 2rem; background: var(--navy); color: #fff; padding: 1.5rem 1.75rem; }
      .op-close p { color: rgba(255,255,255,0.85); margin: 0; }
      .op-close a { color: var(--gold-light); font-weight: 700; }
      .op-foot { margin-top: 1.5rem; font-size: 0.72rem; color: var(--slate); line-height: 1.6; }
      .loading, .error { max-width: 760px; margin: 4rem auto; text-align: center; color: var(--slate); }
      @media print {
        body { background: #fff; padding: 0; }
        .toolbar { display: none; }
        .page { box-shadow: none; padding: 0.5in; max-width: none; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button onclick="window.print()">Download as PDF / Print</button>
    </div>
    <div class="loading" id="loading">Loading analysis…</div>
    <div class="error" id="error" style="display:none;"></div>
    <div class="page" id="page" style="display:none;"></div>

    <script>
      // ══════════════════════════════════════════════════════════════════
      // FILL THIS IN: your scheduling link (Calendly or similar).
      var SCHEDULING_URL = "#"; // TODO: set to your booking URL
      // ══════════════════════════════════════════════════════════════════

      (function () {
        var API = "/.netlify/functions/merchant-review";
        var id = new URLSearchParams(location.search).get("id");
        var key = sessionStorage.getItem("cmf_review_key") || "";

        if (!id || !key) {
          return fail("Open this page from the review dashboard so it can authenticate.");
        }

        fetch(API + "?action=get&id=" + encodeURIComponent(id), {
          headers: { "x-review-key": key },
        })
          .then(function (res) { return res.json(); })
          .then(function (res) {
            if (!res.ok) return fail("Could not load this submission.");
            render(res.submission);
          })
          .catch(function () { fail("Could not load this submission."); });

        function fail(msg) {
          document.getElementById("loading").style.display = "none";
          var e = document.getElementById("error");
          e.textContent = msg;
          e.style.display = "";
        }

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function money(n) {
          return typeof n === "number"
            ? "$" + n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 })
            : "—";
        }
        function pct(n) { return typeof n === "number" ? n.toFixed(2) + "%" : "—"; }

        function render(sub) {
          var a = sub.analysis_override || sub.analysis || {};
          var c = sub.contact || {};
          var fair = !!a.fairly_priced;
          var fairRate = (typeof a.estimated_fair_total_cost === "number" && typeof a.total_card_volume === "number" && a.total_card_volume > 0)
            ? (a.estimated_fair_total_cost / a.total_card_volume) * 100
            : null;

          var flags = (a.red_flags || []).map(function (f) { return "<li>" + esc(f) + "</li>"; }).join("");
          var feeRows = (a.fee_line_items || []).slice(0, 14).map(function (f) {
            return "<tr><td>" + esc(f.label) + "</td><td>" + money(f.amount) + "</td></tr>";
          }).join("");

          var closing;
          if (fair) {
            // The trust play: fairly priced merchants get no sales CTA.
            closing =
              '<div class="op-close"><p><strong>Good news. You are priced fairly.</strong> ' +
              "Keep this analysis for your records, and call us when anything changes.</p></div>";
          } else {
            closing =
              '<div class="op-close"><p><strong>Want the plain-English walkthrough?</strong> ' +
              'Book fifteen minutes. <a href="' + esc(SCHEDULING_URL) + '">Schedule here</a> ' +
              "or call (312) 203-8106.</p></div>";
          }

          var html =
            '<div class="op-head">' +
            '<div class="op-brand"><div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17 L3 7 L8.5 11.5 L12 5 L15.5 11.5 L21 7 L21 17 Z"/><rect x="3" y="18.5" width="18" height="3" rx="1"/></svg></div>' +
            "<strong>Crown Merchant Financial</strong></div>" +
            '<div class="meta">Statement Analysis<br/>' + esc(a.statement_month || "") + "</div></div>" +
            "<h1>" + esc(a.merchant_name || c.business || "Your Business") + "</h1>" +
            '<p class="subtitle">Prepared for ' + esc(c.name || "") + " · Reviewed by a human at CMF</p>" +
            '<div class="op-stats">' +
            '<div class="op-stat"><div class="label">You paid last month</div><div class="value">' + money(a.total_fees_charged) + "</div></div>" +
            '<div class="op-stat"><div class="label">Your effective rate</div><div class="value">' + pct(a.effective_rate) + "</div></div>" +
            (fair
              ? '<div class="op-stat gold"><div class="label">Verdict</div><div class="value">Fair ✓</div></div>'
              : '<div class="op-stat gold"><div class="label">Est. annual savings</div><div class="value">' + money(a.estimated_annual_savings) + "</div></div>") +
            "</div>" +
            "<h2>What a fair price looks like</h2>" +
            "<p>On your volume of " + money(a.total_card_volume) + (a.total_transaction_count ? " across " + a.total_transaction_count.toLocaleString() + " transactions" : "") +
            ", fair pricing (true card cost plus a modest, transparent markup) comes to about <strong>" + money(a.estimated_fair_total_cost) + "</strong> per month" +
            (fairRate != null ? " (an effective rate near " + pct(fairRate) + ")" : "") + ". " +
            (fair
              ? "Your statement is at or near that benchmark. That is what fair looks like."
              : "You paid " + money(a.total_fees_charged) + ". The difference is the number above.") +
            "</p>" +
            (flags ? "<h2>Line items that stand out</h2><ul class=\"flags\">" + flags + "</ul>" : "") +
            (feeRows ? "<h2>Fees we read on your statement</h2><table class=\"fees\">" + feeRows + "</table>" : "") +
            closing +
            '<div class="op-foot">Prepared by the CMF payments desk from the statement you provided. Estimates are based on the statement period shown and standard published card costs; savings are estimates, not guarantees, and your final pricing depends on your card mix and volume. Crown Merchant Financial LLC.</div>';

          document.getElementById("loading").style.display = "none";
          var page = document.getElementById("page");
          page.innerHTML = html;
          page.style.display = "";
          document.title = "Statement Analysis — " + (a.merchant_name || c.business || "CMF");
        }
      })();
    </script>
  </body>
</html>
